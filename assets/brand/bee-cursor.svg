    <!-- stripes -->
    <path d="M15.5 22 H32.5" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M14.5 28 H33.5" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M16.5 34 H31.5" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round"/>
